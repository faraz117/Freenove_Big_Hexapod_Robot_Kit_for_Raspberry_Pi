name: Smoke tests

on:
  push:
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code/Server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Install PyQt5 (best-effort - GUI tests skip gracefully if this fails)
        run: pip install PyQt5 || true

      - name: Run smoke tests
        run: pytest -v
